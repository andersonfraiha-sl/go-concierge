name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        # staging e prod ficam para depois: ver docs/deploy/idp-nexus.md
        options:
          - dev

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: go-concierge
  GITOPS_REPO: ${{ vars.GITOPS_REPO || 'gitops-apps' }}
  GITOPS_OWNER: ${{ vars.GITOPS_OWNER || github.repository_owner }}

# Duas guardas. A de dono: fora da org idp-nexusapps este workflow não roda. A de
# DEPLOY_ENABLED: este é o único workflow disparado por push, e até a plataforma configurar a
# role da AWS e o token do gitops ele falharia a cada commit na main. Quem opera liga o deploy
# criando a variável de repositório DEPLOY_ENABLED=true (não de Environment: variável de
# Environment não é visível no "if" do job).
jobs:
  deploy:
    name: Build, Push & Update GitOps
    if: github.repository_owner == 'idp-nexusapps' && vars.DEPLOY_ENABLED == 'true' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Validate required configuration
        env:
          CHECK_AWS_ROLE: ${{ vars.AWS_ROLE_ARN }}
          CHECK_GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          FAILED=false
          [ -z "$CHECK_AWS_ROLE" ]     && { echo "::error::Missing var: AWS_ROLE_ARN"; FAILED=true; }
          [ -z "$CHECK_GITOPS_TOKEN" ] && { echo "::error::Missing secret: GITOPS_TOKEN"; FAILED=true; }
          if [ "$FAILED" = "true" ]; then
            echo "Configure missing items in: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required configuration is present"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if no setup done yet
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "No version tags found - setup.yml has not run yet. Skipping deploy."
            echo "Run setup first via workflow_dispatch"
            exit 1
          fi

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT="1.0.0"
          else
            VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "tag=v$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: v$NEXT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR Repository URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.PROJECT_NAME }} \
            --query 'repositories[0].repositoryUri' --output text)
          echo "repository_url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repository_url }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -t $ECR_REPOSITORY:$VERSION .
          docker push $ECR_REPOSITORY:$VERSION

      - name: Sync base manifests to GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPO }}"
          AUTH="Authorization: Bearer $GITOPS_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          BASE_PATH="apps/${{ env.PROJECT_NAME }}/base"

          for FILE in .github/k8s/base/*; do
            FILENAME=$(basename "$FILE")
            GITOPS_FILE_PATH="$BASE_PATH/$FILENAME"

            EXISTING=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/contents/$GITOPS_FILE_PATH" || echo "{}")
            SHA=$(echo "$EXISTING" | jq -r '.sha // empty')

            ENCODED=$(base64 -w 0 < "$FILE")

            if [ -n "$SHA" ]; then
              EXISTING_CONTENT=$(echo "$EXISTING" | jq -r '.content // empty' | tr -d '\n ')
              if [ "$ENCODED" = "$EXISTING_CONTENT" ]; then
                echo "Unchanged: $GITOPS_FILE_PATH"
                continue
              fi
            fi

            BODY="{\"message\":\"chore: sync base manifest $FILENAME for ${{ env.PROJECT_NAME }}\",\"content\":\"$ENCODED\",\"branch\":\"main\""
            if [ -n "$SHA" ]; then
              BODY="$BODY,\"sha\":\"$SHA\""
            fi
            BODY="$BODY}"

            curl -s --fail-with-body -X PUT \
              -H "$AUTH" -H "$ACCEPT" \
              "$API/contents/$GITOPS_FILE_PATH" \
              -d "$BODY"
            echo "Synced: $GITOPS_FILE_PATH"
          done

      - name: Update image tag in GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repository_url }}
        run: |
          OVERLAY_PATH="apps/${{ env.PROJECT_NAME }}/overlays/$ENVIRONMENT/kustomization.yaml"

          if [ "$ENVIRONMENT" = "dev" ]; then
            OVERLAY_NS="go-concierge"
          else
            OVERLAY_NS="go-concierge-$ENVIRONMENT"
          fi

          EXISTING=$(curl -s -H "Authorization: Bearer $GITOPS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPO }}/contents/$OVERLAY_PATH" || echo "{}")
          SHA=$(echo "$EXISTING" | jq -r '.sha // empty')

          CONTENT=$(cat << KUSTOMIZE
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          namespace: $OVERLAY_NS

          resources:
            - ../../base

          images:
            - name: PLACEHOLDER_IMAGE
              newName: $ECR_REPOSITORY
              newTag: "$VERSION"
          KUSTOMIZE
          )

          ENCODED=$(echo "$CONTENT" | base64 -w 0)
          BODY="{\"message\":\"deploy: go-concierge $ENVIRONMENT -> v$VERSION\",\"content\":\"$ENCODED\",\"branch\":\"main\""
          if [ -n "$SHA" ]; then
            BODY="$BODY,\"sha\":\"$SHA\""
          fi
          BODY="$BODY}"

          curl -s --fail-with-body -X PUT \
            -H "Authorization: Bearer $GITOPS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPO }}/contents/$OVERLAY_PATH" \
            -d "$BODY"

      - name: Tag release
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists, skipping"
          else
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG"
          fi

      - name: Summary
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## Deploy Successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps Repo:** ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPO }}" >> $GITHUB_STEP_SUMMARY
