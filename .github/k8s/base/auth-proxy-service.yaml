apiVersion: v1
kind: Service
metadata:
  name: go-concierge-auth
  labels:
    app: go-concierge-auth
spec:
  type: ClusterIP
  ports:
    - name: proxy
      port: 4455
      targetPort: proxy
      protocol: TCP
    - name: api
      port: 4456
      targetPort: api
      protocol: TCP
  selector:
    app: go-concierge-auth
