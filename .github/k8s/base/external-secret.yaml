# Segredos do go-concierge, lidos do AWS Secrets Manager pelo External Secrets.
# O nome da chave (idp-go-concierge) é a confirmar com a plataforma.
#
# O JSON do segredo precisa ter estas chaves (cada uma vira uma variável de ambiente):
#   DATABASE_URL                 obrigatória: URL do Postgres, com sslmode
#   ATENDE_API_SECRET            obrigatória: segredo do HMAC do webhook do ATENDE
#   GANCHOS_SEGREDO_EXPORTACAO   obrigatória: segredo do HMAC da exportação de regras
#   INTEGRACAO_CHAVE             chave de serviço de /integracao/v1 (32+ caracteres)
#   ACESSO_ADMIN_INICIAL         e-mail do primeiro admin da Superlógica
#   ATENDE_API_KEY               chave da API do ATENDE (resposta ao morador)
#   ATENDE_TENANT_ID             tenant do ATENDE
#   ATENDE_TENANT_TELEFONE       telefone do canal do tenant
#   GEMINI_API_KEY               com LLM_MODE=gemini
#   OPENROUTER_API_KEY           com LLM_MODE=openrouter
#   LLM_LUNA_GATEWAY_TOKEN       com LLM_MODE=luna
#   MCP_B2C_MOBILE               telefone do token B2C (MCP_AUTH=b2c)
#   MCP_BEARER_TOKEN             com MCP_AUTH=bearer
#   MCP_KEYCLOAK_CLIENT_SECRET   com MCP_AUTH=keycloak
# Chave que não se aplica ao modo escolhido pode ficar de fora do JSON.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-concierge
  labels:
    app: go-concierge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: go-concierge
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: idp-go-concierge
