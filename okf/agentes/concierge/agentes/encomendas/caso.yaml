# Trazido do sl-concierge (gruvi/70_encomendas.yaml). O harness executa estes passos; a escrita só acontece aqui, depois do confirm.
id: encomendas
name: Minhas Encomendas
visibility: private
icon: package
description: >
  Mostra as encomendas da unidade. Por padrão consulta as que aguardam retirada; também pode consultar entregues ou canceladas quando o morador pedir esse status.
keywords: [encomenda, encomendas, pacote, pacotes, entrega, entregues, cancelada, canceladas, correio, correspondência, chegou]
examples:
  - tenho alguma encomenda?
  - chegou algum pacote pra mim?
  - tem entrega na portaria?
  - minhas encomendas já foram entregues?
  - tem algum pacote cancelado?
params:
  - name: reutilizar_unidade
    title: Reutilizar unidade
    type: select
    options: [{value: sim, label: sim}, {value: nao, label: não}]
    ask: Deseja reutilizar a unidade anterior?
  - name: status
    title: Status da encomenda
    type: select
    required: false
    options:
      - {value: waiting, label: aguardando retirada}
      - {value: delivered, label: entregue}
      - {value: canceled, label: cancelada}
steps:
  - resource: gruvi.bff.building-operation.get-company-by-document-controller-handle
    save_as: condominio
  - reuse:
      slot: unidade
      confirm: reutilizar_unidade
      from: condominio
      label: unit
      value: id_fastpass
      ask: Deseja reutilizar a unidade {{.reuso_label}}?
  - choose:
      param: unidade
      title: Unidade
      from: condominio
      label: unit
      value: id_fastpass
      strict: true
      ask: De qual unidade?
      empty: A consulta de encomendas não está disponível para as unidades retornadas.
  - collect: status
  - resource: gruvi.bff.building-operation.fetch-unit-packages-controller-handle
    with:
      unitId: "$unidade"
      filter_status: '{{if .status}}{{.status}}{{else}}waiting{{end}}'
    save_as: encomendas
output: |-
  {{if .encomendas}}Encomendas {{if eq .status "delivered"}}entregues{{else if eq .status "canceled"}}canceladas{{else}}aguardando retirada{{end}} ({{.unidade_label}}):
  {{range .encomendas}}• {{if .description}}{{.description}}{{else if .package_size}}{{.package_size}}{{else}}Encomenda{{end}}{{if .tracking_code}} ({{.tracking_code}}){{end}}
  {{end}}{{else}}Não há encomendas {{if eq .status "delivered"}}entregues{{else if eq .status "canceled"}}canceladas{{else}}aguardando retirada{{end}} para {{.unidade_label}}.{{end}}
