# Trazido do sl-concierge (_default/50_agendar_mudanca.yaml). O harness executa estes passos; a escrita só acontece aqui, depois do confirm.
id: agendar_mudanca
name: Agendamento de Mudança
visibility: private
icon: truck
description: |
  Usado para o morador agendar uma data e período para sua mudança,
  garantindo a reserva do elevador de serviço.
keywords: [mudança, agendar, agendamento, elevador, serviço, mudança de apartamento]
examples:
  - quero agendar minha mudança
  - preciso marcar a data da minha mudança
  - agendar mudança para o dia 15
  - vou me mudar sábado de manhã
params:
  - name: data_mudanca
    title: Data da mudança
    ask: Para qual data você gostaria de agendar a mudança?
    validate: date
  - name: periodo_mudanca
    title: Período da mudança
    ask: Qual período você prefere para a mudança?
    options:
      - value: manha
        label: "Manhã (8h às 12h)"
      - value: tarde
        label: "Tarde (13h às 18h)"
steps:
  - resource: unidades.listar
    save_as: unidades
  - choose:
      param: unidade
      reuse: always # a unidade vale para a conversa toda (o confirm mostra antes de gravar)
      title: Unidade
      from: unidades
      label: label
      value: id
      ask: Para qual unidade é a mudança?
      empty: Não encontrei unidades vinculadas ao seu cadastro. Por favor, entre em contato com a administração.
  - collect: [data_mudanca, periodo_mudanca]
  - confirm: "Confirma o agendamento da mudança para a unidade {{.unidade_label}} em {{.data_mudanca_label}}, {{.periodo_mudanca_label}}? (sim/não)"
  - resource: mudancas.agendar
    with:
      unidade_id: "{{.unidade}}"
      data: "{{.data_mudanca}}"
      periodo: "{{.periodo_mudanca}}"
    save_as: agendamento
output: "Sua mudança para {{.unidade_label}} em {{.data_mudanca_label}}, {{.periodo_mudanca_label}}, foi agendada com sucesso! Protocolo: {{.agendamento.protocolo}}. O elevador de serviço estará reservado para você."
