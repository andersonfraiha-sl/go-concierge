# Trazido do sl-concierge (gruvi/71_codigo_retirada.yaml). O harness executa estes passos; a escrita só acontece aqui, depois do confirm.
id: codigo_retirada
name: Código de Retirada
visibility: private
icon: key-round
description: >
  Informa o código para retirar uma encomenda que já está na portaria.
keywords: [código, codigo, retirada, retirar, senha, encomenda, pacote]
examples:
  - qual o código pra retirar minha encomenda?
  - me passa o código de retirada
  - preciso do código do pacote
params:
  - name: reutilizar_unidade
    title: Reutilizar unidade
    type: select
    options: [{value: sim, label: sim}, {value: nao, label: não}]
    ask: Deseja reutilizar a unidade anterior?
steps:
  - resource: gruvi.bff.building-operation.get-company-by-document-controller-handle
    save_as: condominio
  - reuse:
      slot: unidade
      confirm: reutilizar_unidade
      from: condominio
      label: unit
      value: id_fastpass
      ask: Deseja reutilizar a unidade {{.reuso_label}}?
  - choose:
      param: unidade
      title: Unidade
      from: condominio
      label: unit
      value: id_fastpass
      strict: true
      ask: De qual unidade?
      empty: A consulta de encomendas não está disponível para as unidades retornadas.
  - resource: gruvi.bff.building-operation.fetch-unit-packages-controller-handle
    with:
      unitId: "$unidade"
      filter_status: waiting
    save_as: encomendas
  - choose:
      param: encomenda
      title: Encomenda
      from: encomendas
      label: description
      value: id
      strict: true
      ask: De qual encomenda?
      empty: Não há encomendas aguardando retirada no momento.
  - resource: gruvi.bff.building-operation.get-package-delivery-code-controller-handle
    with:
      unitId: "$unidade"
      packageId: "$encomenda"
    save_as: retirada
output: "O código de retirada de {{.encomenda_label}} é *{{.retirada.delivery_code}}*. Apresente na portaria."
