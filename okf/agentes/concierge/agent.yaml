descricao: concierge do condomínio no WhatsApp — recebe a conversa espontânea do condômino e delega ao especialista certo (observador da sessão, regimento, dúvidas gerais, liberação de visitante, segunda via de boleto, confirmação de pagamento, débito e acordo, documentos, chamado de manutenção) ou transfere ao atendente. Vários pedidos são permitidos.
