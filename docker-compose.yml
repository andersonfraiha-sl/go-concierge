name: go-concierge

include:
  - apps/concierge/docker-compose.yml

services:
  backdoor:
    extends:
      file: apps/backdoor/docker-compose.yml
      service: backdoor
    depends_on:
      concierge:
        condition: service_healthy
  console:
    extends:
      file: apps/console/docker-compose.yml
      service: console
    depends_on:
      concierge:
        condition: service_healthy
