# go-concierge em Docker: o servidor MCP oficial (catálogo das OpenAPIs do BFF do Gruvi,
# em Node) e o concierge (okf-admin, em Go) que usa as tools dele como recursos do Nexus.
#
#   docker compose up -d --build
#   Studio: http://127.0.0.1:8090/studio/ · Console: http://127.0.0.1:8090/console
#   (o mcp roda na rede do concierge, porque a POC do MCP só escuta em loopback)
#
# Credenciais: mcp/.env é o .env da entrega (BFF, LLM gateway); o .env da raiz tem as do
# concierge (LLM, Gruvi, ATENDE) e o fluxo B2C (MCP_AUTH=b2c, MCP_B2C_MOBILE…): o concierge
# obtém o token de morador pelo SMS de dev e o repassa ao MCP por requisição.
services:
  # O front é servido pelo próprio concierge: o Studio vai compilado e embutido no binário;
  # o Console (web/okf) também, e aqui é montado do repositório (-web), para editar sem rebuild.
  concierge:
    build: .
    user: "${CONCIERGE_UID:-65532}:${CONCIERGE_GID:-65532}"
    env_file:
      - path: ./.env
        required: false
    environment:
      MCP_URL: ${MCP_URL:-http://127.0.0.1:3337/mcp/gruvi/bff}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      UTCP_MANUAL_URL: ${UTCP_MANUAL_URL:-http://127.0.0.1:3345/utcp}
      DEFAULT_ACCOUNT_ID: ${DEFAULT_ACCOUNT_ID:-cond-001}
      # router (padrão) | planning | react — vence o `orquestracao:` do agent.yaml
      ORQUESTRACAO_MODO: ${ORQUESTRACAO_MODO:-}
      # vence o DATABASE_URL do .env, que aponta para 127.0.0.1 (uso fora do compose)
      DATABASE_URL: postgres://concierge:concierge@postgres:5432/concierge?sslmode=disable
      AMBIENTE: ${AMBIENTE:-dev}
      # dev: o usuário vem do cabeçalho X-Dev-Usuario ou, sem ele, de AUTH_DEV_USUARIO
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_DEV_USUARIO: ${AUTH_DEV_USUARIO:-admin-superlogica}
    command: ["-root", "/app/okf", "-addr", "0.0.0.0:8090", "-env", "/app/.env", "-web", "/app/web"]
    volumes:
      # o catálogo editado pelo Studio fica no repositório (agentes, instantâneo, var/)
      - ./okf:/app/okf
      # o front, servido do disco: mexeu em web/okf, é só recarregar a página
      - ./web/okf:/app/web:ro
    ports:
      - "127.0.0.1:${CONCIERGE_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    # distroless não tem shell nem curl: o próprio binário consulta o /readyz
    healthcheck:
      test: ["CMD", "/app/okf-admin", "saude", "-url", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Postgres 18: a partir do 18 a imagem guarda os dados numa subpasta por versão, então o
  # volume vai em /var/lib/postgresql (e não em .../data, que quebra).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: concierge
      POSTGRES_DB: concierge
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concierge -d concierge"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Servidor MCP da entrega. A POC só escuta em loopback, então ele roda NA REDE do concierge
  # (network_mode): o concierge o alcança em 127.0.0.1:3337. A porta 3337 não é publicada:
  # de fora, o MCP responde em http://127.0.0.1:8090/mcp/gruvi/bff (repasse do concierge,
  # com o Authorization: Bearer do cliente). Recriou o concierge? Recrie o mcp também
  # (docker compose up -d --build), porque ele mora no namespace de rede do concierge.
  mcp:
    build: ./mcp
    env_file:
      - path: ./mcp/.env
        required: false
    environment:
      MCP_CATALOG_AGENT_MCP_HOST: 127.0.0.1
      MCP_CATALOG_AGENT_MCP_PORT: "3337"
    network_mode: "service:concierge"
    depends_on:
      - concierge
    restart: unless-stopped

  utcp:
    build: ./mcp
    command: ["npx", "tsx", "utcp/manual-main.ts"]
    env_file:
      - path: ./mcp/.env
        required: false
    environment:
      AGENT_UTCP_MANUAL_HOST: 127.0.0.1
      AGENT_UTCP_MANUAL_PORT: "3345"
    network_mode: "service:concierge"
    depends_on:
      - concierge
    restart: unless-stopped

volumes:
  pgdata:
