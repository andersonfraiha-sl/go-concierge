# misspell fica de fora: código e comentários são pt-BR e ele acusa palavras válidas
# (protocolos, comando, autor...).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - errorlint
    - bodyclose
    - nilerr
    - gocritic
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - filepathJoin # testes montam caminhos do catálogo com separador literal
        - ifElseChain # estilo
        - singleCaseSwitch
        - sprintfQuotedString
        - unlambda
        - commentedOutCode
        - evalOrder
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1005 # mensagens de erro em pt-BR e mock de erro de provedor
        - -ST1013
        - -QF1001 # sugestoes de estilo (De Morgan, switch marcado)
        - -QF1002
        - -QF1003
        - -QF1008
        - -S1025
    gosec:
      excludes:
        - G104 # duplica o errcheck
  exclusions:
    generated: lax
    paths:
      - internal/banco/ent
      - internal/banco/sqlc
    rules:
      # FS local: caminho e permissão de arquivo são decisão do operador do okf-admin
      - linters: [gosec]
        text: "G(301|304|306|703|706):"
      # sinalizacoes de taint e de servidor local do okf-admin (ferramenta de operador em loopback)
      - linters: [gosec]
        text: "G(114|118|204|404|705|115|122|101):"
      - linters: [errcheck, staticcheck]
        path: _test\.go
      # testes: aleatório fraco, credenciais e cookies de fixture
      - linters: [gosec]
        path: _test\.go
      # Close/Write de best effort (defer, resposta HTTP já enviada)
      - linters: [errcheck]
        text: "Error return value (of `[\\w.]*(Close|Write|Fprint|Fprintf|Fprintln|Encode)` )?is not checked"
      # nil intencional: caminho ausente no catálogo não é erro
      - linters: [nilerr]
        path: internal/okf/
